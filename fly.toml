# Configuración de Fly.io para Ebooksparalavida
app = "ebooksparalavida"
primary_region = "eze"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/"
protocol = "http"
timeout = "5s"

[[vm]]
memory = "2048mb"
cpu_kind = "shared"
cpus = 2
